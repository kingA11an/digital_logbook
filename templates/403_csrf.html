{% extends 'base.html' %} 

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 text-center">
        <div>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
                Session Conflict Detected
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                It looks like your login session changed in another tab. This usually happens if you logged into a different account or your session expired.
            </p>
        </div>
        <div class="mt-8">
            <a href="{% url 'accounts:login' %}" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
