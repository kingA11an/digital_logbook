{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something Went Wrong | TrueLog</title>
    <link rel="icon" type="image/png" href="{% static 'images/truelog_icon.png' %}" />
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="flex min-h-full items-center justify-center bg-[#0a0f1c] px-4 py-12 text-white antialiased">
    <div class="w-full max-w-md rounded-md border border-slate-800 bg-[#0f172a] p-8 text-center shadow-2xl">
      <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-md bg-brand-500 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
      </span>

      <p class="mt-6 text-sm font-semibold uppercase tracking-wider text-brand-500">Error 500</p>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight text-white">Something went wrong</h1>
      <p class="mt-3 text-sm text-slate-400">
        An unexpected error occurred on our side. Please try again in a moment. If the problem persists, contact the system administrator.
      </p>

      <a href="{% url 'accounts:login' %}"
         class="mt-8 inline-flex w-full items-center justify-center gap-2 rounded-md bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-[#0a0f1c]">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Back to login
      </a>
    </div>
  </body>
</html>
