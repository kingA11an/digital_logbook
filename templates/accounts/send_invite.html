{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 sm:p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-white">Invite Supervisor</h2>
            <p class="text-sm text-slate-400 mt-1">Send a secure one-time onboarding link to a Field or University Supervisor.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-xl text-sm font-medium {% if message.tags == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}bg-rose-500/10 text-rose-400 border border-rose-500/20{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Supervisor Email Address</label>
                <input type="email" name="email" id="email" required placeholder="supervisor@organization.com"
                    class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-slate-300 mb-2">Supervisor Role</label>
                <select name="role" id="role" required
                    class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <option value="FIELD">Field Supervisor (Industry / Company)</option>
                    <option value="UNI">University Supervisor (Academic Evaluator)</option>
                </select>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition shadow-lg shadow-indigo-600/20">
                    Send Invitation Email
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
