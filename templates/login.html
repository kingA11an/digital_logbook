{% extends 'base.html' %} 

{% block title %}Login | Digital Logbook {% endblock %} 

{% block content %}
<div
  class="min-h-[80vh] flex flex-col justify-center items-center py-12 sm:px-6 lg:px-8"
>
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-6">
    <h2
      class="text-3xl font-extrabold tracking-tight text-gray-900 dark:text-white"
    >
      Welcome back
    </h2>
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
      Sign in to access your attachment logbook dashboard
    </p>
  </div>

  <div class="w-full sm:max-w-md">
    <div
      class="bg-white dark:bg-darkcard py-8 px-6 shadow-xl rounded-xl border border-gray-200 dark:border-gray-800 sm:px-10"
    >
      <!-- Error banner (populates if login fails)-->
      {% if form.errors or error_message %}
      <div
        class="mb-6 p-4 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm"
      >
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <form method="POST" action="{% url 'accounts:login' %}" class="space-y-6">
        <!-- CSRF Token: Essential for Django form security -->
        {% csrf_token %}

        <!-- username field -->
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Username / Registration No.
          </label>
          <div class="mt-1">
            <input
              id="username"
              name="username"
              type="text"
              required
              class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-darkbg text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-colors"
              placeholder="e.g. Allan Doe"
            />
          </div>
        </div>

        <!-- password field-->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Password
          </label>
          <div class="mt-1">
            <input
              id="password"
              name="password"
              type="password"
              required
              class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-darkbg text-gray-900 dark:text-white focus:ring-brand-500 focus:border-brand-500 outline-none transition-colors"
              placeholder="........"
            />
          </div>
        </div>

        <!-- submit button-->
        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-3 px-4 rounded-lg text-sm font-semibold text-white bg-brand-500 hover:bg-brand-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors shadow-md"
          >
            Sign In
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
